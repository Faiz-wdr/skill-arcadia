name: Supabase Keepalive

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase keepalive function
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
        run: |
          set -e

          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/keepalive"

          echo "Calling Supabase keepalive..."

          RESPONSE=$(curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --url "$URL" \
            --header "Content-Type: application/json" \
            --header "X-Keepalive-Token: ${SUPABASE_KEEPALIVE_TOKEN}")

          echo "Supabase response:"
          echo "$RESPONSE"

          echo "Keepalive completed successfully."
